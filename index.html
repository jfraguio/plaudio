<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Your audiobooks, made simple." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plaudio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Plaudio</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <span class="wordmark">PLAUDIO</span>
        <div class="menu-wrap">
          <button
            id="menu-button"
            class="menu-button"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="app-menu"
            aria-label="More options"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="5" r="1.8" />
              <circle cx="12" cy="12" r="1.8" />
              <circle cx="12" cy="19" r="1.8" />
            </svg>
          </button>
          <div id="app-menu" class="app-menu" role="menu" hidden>
            <button id="menu-continue" class="menu-item" type="button" role="menuitem" hidden>
              Continue
            </button>
            <button id="menu-open" class="menu-item" type="button" role="menuitem">Open</button>
            <button id="menu-info" class="menu-item" type="button" role="menuitem">Info</button>
          </div>
        </div>
      </header>

      <main class="app-main">
        <section id="empty-state" class="empty-state">
          <p class="tagline">The Golden<br />Audiobook Player</p>
          <button id="open-button" class="primary-button" type="button">Open</button>
          <input
            id="file-input"
            class="visually-hidden"
            type="file"
            accept=".m4b,.m4a,.mp4,.m4v,.mov,audio/mp4,audio/x-m4a,audio/m4b,video/mp4"
          />
        </section>

        <section id="player" class="player" hidden>
          <div class="cover-wrap">
            <img id="cover" class="cover" alt="Audiobook cover" decoding="async" />
          </div>

          <div class="book-info">
            <h1 id="book-title" class="book-title"></h1>
            <p id="book-author" class="book-author" hidden></p>
            <p id="chapter-title" class="chapter-title" aria-live="polite"></p>
          </div>

          <div class="progress-block">
            <input
              id="seek"
              class="seek"
              type="range"
              min="0"
              max="100"
              step="1"
              value="0"
              aria-label="Playback position"
              disabled
            />
            <div class="time-row">
              <span id="time-current" class="time">--:--</span>
              <span id="time-remaining" class="time">--:--</span>
            </div>
          </div>

          <div class="controls">
            <button id="back" class="skip-button" type="button" aria-label="Rewind 15 seconds">
              <svg class="skip-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
              <span class="skip-value" aria-hidden="true">15</span>
            </button>

            <button id="play" class="play-button" type="button" aria-label="Play">
              <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5.2v13.6L19 12z" />
              </svg>
              <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="7" y="5" width="3.4" height="14" rx="1.7" />
                <rect x="13.6" y="5" width="3.4" height="14" rx="1.7" />
              </svg>
            </button>

            <button
              id="forward"
              class="skip-button"
              type="button"
              aria-label="Forward 30 seconds"
            >
              <svg class="skip-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                <path d="M21 3v5h-5" />
              </svg>
              <span class="skip-value" aria-hidden="true">30</span>
            </button>
          </div>

          <div class="bottom-row">
            <div class="bottom-control speed-control">
              <span id="rate-value" class="control-value">1&times;</span>
              <span class="control-label">Speed</span>
              <select id="rate" class="control-select" aria-label="Playback speed">
                <option value="0.75">0.75&times;</option>
                <option value="1" selected>1&times;</option>
                <option value="1.25">1.25&times;</option>
                <option value="1.5">1.5&times;</option>
                <option value="1.75">1.75&times;</option>
                <option value="2">2&times;</option>
              </select>
            </div>

            <span class="bottom-divider" aria-hidden="true"></span>

            <button id="chapters-button" class="bottom-control" type="button" hidden>
              <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                <line x1="9" y1="6" x2="21" y2="6" />
                <line x1="9" y1="12" x2="21" y2="12" />
                <line x1="9" y1="18" x2="21" y2="18" />
                <line x1="3.5" y1="6" x2="3.51" y2="6" />
                <line x1="3.5" y1="12" x2="3.51" y2="12" />
                <line x1="3.5" y1="18" x2="3.51" y2="18" />
              </svg>
              <span class="control-label">Chapters</span>
            </button>
            <div id="chapters-placeholder" class="bottom-control placeholder" aria-hidden="true"></div>
          </div>

          <p id="error" class="error" role="alert" hidden></p>
        </section>
      </main>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <dialog id="chapters-dialog" class="chapters-dialog">
        <div class="dialog-header">
          <h2>Chapters</h2>
          <button id="chapters-close" class="icon-button small" type="button" aria-label="Close">
            &times;
          </button>
        </div>
        <ol id="chapters-list" class="chapters-list"></ol>
      </dialog>

      <dialog id="info-dialog" class="info-dialog">
        <div class="dialog-header">
          <h2>Info</h2>
          <button id="info-close" class="icon-button small" type="button" aria-label="Close">
            &times;
          </button>
        </div>
        <div class="info-content">
          <p class="info-app">PLAUDIO</p>
          <p class="info-tagline">The Golden Audiobook Player</p>
          <p class="info-text">
            Plays audiobooks stored on your device. Your files never leave it.
          </p>
          <h3 class="info-heading">Supported formats</h3>
          <ul class="info-list">
            <li><span>M4B</span><span class="info-ext">.m4b</span></li>
            <li><span>M4A</span><span class="info-ext">.m4a</span></li>
            <li><span>MP4</span><span class="info-ext">.mp4</span></li>
            <li><span>M4V · MOV</span><span class="info-ext">.m4v · .mov</span></li>
          </ul>
        </div>
      </dialog>
    </div>
  </body>
</html>
